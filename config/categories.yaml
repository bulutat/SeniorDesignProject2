# Kategori ve kriter tanımları.
# Ağırlıklar taslaktır (weighted_v0). Aşama 3'te AHP veya danışmanla belirlenen
# gerekçeli ağırlıklarla güncellenecek. Her kategoride toplamı 1 olmalı.

defaults:
  # DOĞRULANMADI. Resmi EPDK mesken tablosu okunamadı; ikincil kaynaklar çelişiyor
  # (kademe 1: 2,92 TL/kWh, kademe 2: 4,32 TL/kWh, KDV hariç, Nisan 2026 dönemi gibi).
  # Kaynaklar ve açık soru: docs/decisions.md karar 11. Teyit edilince güncellenecek.
  electricity_price_tl_per_kwh: 3.0
  # İSKİ 2026 konut tarifesi, 0-15 m3/ay kademesi: su 43,70 + atık su 21,82 = 65,52 TL/m3,
  # KDV hariç. Kaynak: https://iski.istanbul/abone-hizmetleri/abone-rehberi/su-birim-fiyatlari/
  # (okunma tarihi 2026-10-30). Karar 10.
  water_price_tl_per_m3: 65.52
  rating_prior_count: 10              # Bayes ortalaması için öncül değerlendirme sayısı
  label_thresholds:
    recommended: 70                   # skor >= 70  -> Önerilir
    neutral: 45                       # 45 <= skor < 70 -> Nötr, altı -> Önerilmez

criteria:
  energy_efficiency: { name: Enerji verimliliği,   source: structured }
  lifetime_cost:     { name: Uzun vadeli maliyet,  source: structured }
  durability:        { name: Dayanıklılık,         source: reviews }
  service:           { name: Servis ve arıza,      source: reviews }
  price_advantage:   { name: Fiyat avantajı,       source: structured }
  satisfaction:      { name: Genel memnuniyet,     source: mixed }

categories:
  refrigerator:
    name: Buzdolabı
    lifetime_years: 12                         # KAYNAKSIZ varsayım, karar 12
    eprel_group: refrigeratingappliances2019   # EPREL adresinde doğrulandı (2026-10-30)
    weights:
      energy_efficiency: 0.25
      lifetime_cost: 0.25
      durability: 0.20
      service: 0.10
      price_advantage: 0.10
      satisfaction: 0.10

  washing_machine:
    name: Çamaşır makinesi
    lifetime_years: 12                          # Eko-tasarım çalışmalarında 12,5 yıl; karar 12
    annual_cycles: 220                          # Yönetmelik (AB) 2019/2023 Ek V'de yılda 220 yıkama
    eprel_group: washingmachines2019            # EPREL adresinde doğrulandı (2026-10-30)
    weights:
      energy_efficiency: 0.15
      lifetime_cost: 0.20
      durability: 0.25
      service: 0.20
      price_advantage: 0.10
      satisfaction: 0.10
